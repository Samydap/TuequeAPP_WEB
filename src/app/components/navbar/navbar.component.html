<!-- Sidebar vertical izquierda -->
<aside class="sidebar" [class.collapsed]="sidebarCollapsed">

  <!-- Header / Brand -->
  <div class="sidebar-header">
    <div class="brand" *ngIf="!sidebarCollapsed">
      <span class="brand-icon">🔄</span>
      <span class="brand-name">TruequeApp</span>
    </div>
    <span class="brand-icon-only" *ngIf="sidebarCollapsed">🔄</span>
    <button class="toggle-btn" (click)="toggleSidebar()">
      <i class="bi" [class.bi-chevron-left]="!sidebarCollapsed" [class.bi-chevron-right]="sidebarCollapsed"></i>
    </button>
  </div>

  <!-- Nav links (solo si autenticado) -->
  <nav class="sidebar-nav" *ngIf="authService.estaAutenticado()">
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
      <i class="bi bi-speedometer2"></i>
      <span class="nav-label" *ngIf="!sidebarCollapsed">Dashboard</span>
    </a>

    <a class="nav-item" routerLink="/articulos" routerLinkActive="active">
      <i class="bi bi-box-seam"></i>
      <span class="nav-label" *ngIf="!sidebarCollapsed">Artículos</span>
    </a>

    <a class="nav-item" routerLink="/intercambios" routerLinkActive="active">
      <i class="bi bi-arrow-left-right"></i>
      <span class="nav-label" *ngIf="!sidebarCollapsed">Intercambios</span>
    </a>

    <a class="nav-item position-relative" routerLink="/chat" routerLinkActive="active">
      <i class="bi bi-chat-dots"></i>
      <span class="nav-label" *ngIf="!sidebarCollapsed">Mensajes</span>
      <span
        class="badge rounded-pill bg-danger position-absolute"
        style="top: 6px; right: 10px; font-size: 0.65rem;"
        *ngIf="mensajesNoLeidos > 0"
      >{{ mensajesNoLeidos }}</span>
    </a>

    <a class="nav-item" routerLink="/usuarios" routerLinkActive="active">
      <i class="bi bi-people"></i>
      <span class="nav-label" *ngIf="!sidebarCollapsed">Usuarios</span>
    </a>
  </nav>

  <!-- Footer: usuario + cerrar sesión -->
  <div class="sidebar-footer" *ngIf="authService.estaAutenticado()">
    <div class="user-info" *ngIf="!sidebarCollapsed">

      <div class="user-avatar-container me-2">
        <!-- fotoUrl se actualiza reactivamente vía BehaviorSubject sin recargar la página -->
        <img
          *ngIf="fotoUrl"
          [src]="fotoUrl"
          alt="Avatar Navbar"
          class="rounded-circle border border-2 border-light shadow-sm"
          style="width:36px;height:36px;object-fit:cover;display:block;"
        >
        <div
          *ngIf="!fotoUrl"
          class="rounded-circle bg-primary d-flex align-items-center justify-content-center shadow-sm"
          style="width:36px;height:36px;"
        >
          <span class="text-white small fw-bold" style="font-size:14px;">
            {{ usuario?.nombre?.[0]?.toUpperCase() || 'U' }}
          </span>
        </div>
      </div>

      <div class="user-details">
        <span class="user-name">{{ usuario?.nombre }}</span>
        <span class="user-email">{{ usuario?.email }}</span>
      </div>
    </div>

    <button class="logout-btn" (click)="logout()" [title]="sidebarCollapsed ? 'Cerrar sesión' : ''">
      <i class="bi bi-box-arrow-right"></i>
      <span *ngIf="!sidebarCollapsed">Cerrar sesión</span>
    </button>
  </div>

  <!-- Footer sin sesión -->
  <div class="sidebar-footer" *ngIf="!authService.estaAutenticado()">
    <a class="nav-item" routerLink="/login">
      <i class="bi bi-person"></i>
      <span class="nav-label" *ngIf="!sidebarCollapsed">Iniciar sesión</span>
    </a>
    <a class="nav-item" routerLink="/registro">
      <i class="bi bi-person-plus"></i>
      <span class="nav-label" *ngIf="!sidebarCollapsed">Registrarse</span>
    </a>
  </div>

</aside>
