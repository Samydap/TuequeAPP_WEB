<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-0"><i class="bi bi-people me-2 text-primary"></i>Usuarios</h3>
      <small class="text-muted">Comunidad de TruequeApp</small>
    </div>
    <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario"
      (click)="editarPerfil()">
      <i class="bi bi-person-gear me-1"></i>Editar mi perfil
    </button>
  </div>

  <div class="row g-3" *ngIf="usuarios.length > 0; else sinUsuarios">
    <div class="col-sm-6 col-md-4 col-lg-3" *ngFor="let u of usuarios">
      <div class="card border-0 shadow-sm h-100" [class.border-primary]="esPropioUsuario(u)">
        <div class="card-body text-center py-4">
          <div class="mb-3">
            <img *ngIf="u.foto" [src]="u.foto" alt="foto" class="rounded-circle"
              style="width:64px;height:64px;object-fit:cover;">
            <div *ngIf="!u.foto"
              class="rounded-circle bg-primary d-flex align-items-center justify-content-center mx-auto"
              style="width:64px;height:64px;">
              <span class="text-white fs-4 fw-bold">{{ u.nombre[0]?.toUpperCase() }}</span>
            </div>
          </div>
          <h6 class="fw-bold mb-1">
            {{ u.nombre }}
            <span *ngIf="esPropioUsuario(u)" class="badge bg-primary ms-1 small">Tú</span>
          </h6>
          <p class="text-muted small mb-1">{{ u.email }}</p>
          <p *ngIf="u.telefono" class="text-muted small mb-1"><i class="bi bi-telephone me-1"></i>{{ u.telefono }}</p>
          <p *ngIf="u.direccion" class="text-muted small mb-0"><i class="bi bi-geo-alt me-1"></i>{{ u.direccion }}</p>

          <div *ngIf="esPropioUsuario(u)" class="mt-3 d-flex gap-2 justify-content-center">
            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario"
              (click)="editarPerfil()">
              <i class="bi bi-pencil me-1"></i>Editar
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="eliminarCuenta(u._id)">
              <i class="bi bi-trash me-1"></i>Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #sinUsuarios>
    <div class="text-center py-5">
      <i class="bi bi-people fs-1 text-muted"></i>
      <p class="text-muted mt-2">No hay usuarios registrados.</p>
    </div>
  </ng-template>
</div>

<!-- Modal editar perfil -->
<div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="bi bi-person-gear me-2"></i>Editar perfil</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" (click)="cerrarModal()"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="usuarioForm" id="formUsuario" (ngSubmit)="guardar()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="nombre"
              [class.is-invalid]="usuarioForm.get('nombre')?.invalid && usuarioForm.get('nombre')?.touched">
            <div class="invalid-feedback">El nombre es requerido.</div>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold">Teléfono</label>
              <input type="text" class="form-control" formControlName="telefono" placeholder="Opcional">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold">Dirección / Ciudad</label>
              <input type="text" class="form-control" formControlName="direccion" placeholder="Opcional">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">URL foto de perfil</label>
            <input type="text" class="form-control" formControlName="foto" placeholder="https://...">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="cerrarModal()">Cancelar</button>
        <button type="submit" form="formUsuario" class="btn btn-primary" [disabled]="usuarioForm.invalid || cargando">
          <span *ngIf="cargando" class="spinner-border spinner-border-sm me-1"></span>
          Guardar cambios
        </button>
      </div>
    </div>
  </div>
</div>
