<div *ngIf="puedeResenar">
  <!-- Ya resenado -->
  <div *ngIf="yaResenado" class="alert alert-success py-2 mb-0">
    <i class="bi bi-check-circle me-1"></i>
    {{ enviado ? 'Reseña enviada. ¡Gracias!' : 'Ya enviaste una reseña para este intercambio.' }}
  </div>

  <!-- Formulario -->
  <div *ngIf="!yaResenado" class="card border-0 shadow-sm mt-2">
    <div class="card-body">
      <h6 class="fw-bold mb-3"><i class="bi bi-star-half me-1 text-warning"></i>Calificar intercambio</h6>

      <!-- Estrellas -->
      <div class="d-flex gap-1 mb-3">
        <span
          *ngFor="let n of estrellas"
          class="fs-2"
          [class.text-warning]="estrellaActiva(n)"
          [class.text-muted]="!estrellaActiva(n)"
          style="cursor:pointer; transition: color 0.15s;"
          (mouseenter)="hoverEstrella(n)"
          (mouseleave)="salirHover()"
          (click)="seleccionarEstrella(n)"
        >&#9733;</span>
      </div>
      <div class="text-muted small mb-3" *ngIf="ratingSeleccionado">
        {{ ['', 'Muy malo', 'Malo', 'Regular', 'Bueno', 'Excelente'][ratingSeleccionado] }}
      </div>

      <!-- Comentario -->
      <form [formGroup]="reviewForm">
        <div class="mb-3">
          <textarea
            class="form-control"
            formControlName="comment"
            rows="3"
            placeholder="Comentario opcional (max. 500 caracteres)"
            maxlength="500"
          ></textarea>
          <div class="text-end text-muted small mt-1">
            {{ reviewForm.value.comment?.length || 0 }}/500
          </div>
        </div>
        <button
          class="btn btn-warning fw-semibold"
          [disabled]="enviando || !ratingSeleccionado"
          (click)="enviar()"
        >
          <span *ngIf="enviando" class="spinner-border spinner-border-sm me-1"></span>
          <i *ngIf="!enviando" class="bi bi-send me-1"></i>
          Enviar reseña
        </button>
      </form>
    </div>
  </div>
</div>
