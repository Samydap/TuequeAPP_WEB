<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <span class="fs-2">🔄</span>
        <h2 class="fw-bold mt-1 mb-0">TruequeApp</h2>
        <p class="text-muted small">Inicia sesión para continuar</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="correo@ejemplo.com"
            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <div class="invalid-feedback">Ingresa un email válido.</div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Contraseña</label>
          <input type="password" class="form-control" formControlName="password" placeholder="Mínimo 4 caracteres"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <div class="invalid-feedback">La contraseña debe tener al menos 4 caracteres.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-1" [disabled]="loginForm.invalid || cargando">
          <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
          Iniciar sesión
        </button>
      </form>

      <hr class="my-3">
      <p class="text-center text-muted small mb-0">
        ¿No tienes cuenta? <a routerLink="/registro" class="text-decoration-none fw-semibold">Regístrate</a>
      </p>
    </div>
  </div>
</div>
